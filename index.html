<main>

      <div class="hero-cta">

        </a>
        <a class="btn btn-line" id="waHero" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.45 15.05L2 22l5.1-1.55A9.9 9.9 0 1 0 12.04 2Zm4.5 11.95c-.25-.12-1.46-.72-1.69-.8-.23-.09-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.54.06a6.7 6.7 0 0 1-3.3-2.88c-.25-.43.25-.4.72-1.34.08-.16.04-.3-.02-.42-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.42h-.47c-.16 0-.43.06-.65.3-.23.25-.86.84-.86 2.05s.88 2.38 1 2.55c.12.16 1.73 2.64 4.2 3.7 1.55.67 2.15.73 2.93.62.47-.07 1.46-.6 1.66-1.18.2-.58.2-1.07.14-1.18-.06-.1-.23-.16-.47-.28Z"/></svg>

    <img class="hero-camel" src="camel.png" alt="" width="380" height="271">
  </div>
</section>

<section class="catalog" id="catalog">
  <div class="toolbar">
    <div class="toolbar-in">
      <div class="chips" id="chips" role="tablist" aria-label="تصفية حسب القسم"></div>
      <div class="tool-row">
        <p class="count" id="count" aria-live="polite"></p>
        <label class="sort">
          <span>الترتيب</span>
          <select id="sort">
            <option value="def">الافتراضي</option>
            <option value="asc">السعر: الأقل أولاً</option>
            <option value="desc">السعر: الأعلى أولاً</option>
            <option value="name">الاسم</option>
          </select>
        </label>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <h3>مفيش صنف بالاسم ده</h3>
      <p>جرّب كلمة تانية، أو اسأل عنه مباشرة على واتساب.</p>
      <a class="btn btn-gold" id="waEmpty" target="_blank" rel="noopener">اسأل عن الصنف</a>
    </div>
    <div id="sentinel" style="height:1px"></div>
    <button class="btn btn-navy more" id="more" hidden>عرض المزيد</button>
  </div>
</section>
